services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shiftportal}
      POSTGRES_USER: ${POSTGRES_USER:-shiftportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiftportal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shiftportal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-shiftportal}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shiftportal-db-data:
